version: '3.8'

services:
  app:
    build: .
    container_name: fastapi-log-manager
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
    environment:
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=7
      - DISK_THRESHOLD_PERCENT=80
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
